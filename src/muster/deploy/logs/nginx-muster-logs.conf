# muster-logs.linsheng.dev: the log collector (ADR 0229). The public 8443 maps
# to this host's 443, as for linsheng.dev; nginx picks this server by SNI,
# terminates TLS and passes uploads to the collector on loopback.
# Needs a DNS record for the name and a certificate covering it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name muster-logs.linsheng.dev;

    ssl_certificate     /etc/letsencrypt/live/muster-logs.linsheng.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muster-logs.linsheng.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # One upload is at most 16 MiB (muster_logs::wire::MAX_BODY).
    client_max_body_size 16m;
    client_body_timeout 60s;

    location = /v1/logs {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9180;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The collector's per-address limit counts this address; it trusts
        # the header only because it listens on loopback.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9180;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}

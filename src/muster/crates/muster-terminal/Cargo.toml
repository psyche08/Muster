[package]
name = "muster-terminal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal service: the iTerm2 API client with line-level deltas; SSH client and VT grid for the phone"

[dependencies]
muster-proto = { path = "../muster-proto" }
muster-core = { path = "../muster-core" }
p256.workspace = true
thiserror.workspace = true
futures-util.workspace = true
log.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true
libc.workspace = true
russh = { version = "0.63", default-features = false, features = ["ring"] }
vte = "0.15"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
rand.workspace = true
env_logger.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[lints]
workspace = true

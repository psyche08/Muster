[package]
name = "muster-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent service: Codex and Claude session viewers with change push, Accessibility-only session control"

[dependencies]
muster-proto = { path = "../muster-proto" }
muster-core = { path = "../muster-core" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
log.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
url = "2"
regex = "1"
unicode-normalization = "0.1"
rand.workspace = true
libc.workspace = true
notify.workspace = true
async-trait = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
ruzstd = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
env_logger.workspace = true

# build.rs compiles profiles/*.toml (the desktop app profiles, §3.6.4) into
# the statics of `profile`.
[build-dependencies]
serde.workspace = true
toml = "0.8"

[lints]
workspace = true

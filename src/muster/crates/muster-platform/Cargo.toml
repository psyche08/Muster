[package]
name = "muster-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "What only the operating system provides, behind traits: macOS lock state, Accessibility control of desktop agent apps, the Secure Enclave signer, the NetHelper client"

[features]
# The Secure Enclave signer: build.rs compiles the SepSign Swift library
# (src/native/apple/MusterMacShim) with swiftc and links it with the Swift
# runtime, so this needs a macOS host with Xcode. Build musterd with its own
# `sep` feature (which enables this one and sets the rpath). Without the
# feature musterd on macOS keeps a software key.
sep = []

[dependencies]
muster-proto = { path = "../muster-proto" }
muster-agent = { path = "../muster-agent" }
muster-store = { path = "../muster-store" }
muster-core = { path = "../muster-core" }
anyhow.workspace = true
tokio.workspace = true
async-trait = "0.1"
serde_json.workspace = true
url = "2"
log.workspace = true
libc.workspace = true
rand.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[lints]
workspace = true

[package]
name = "muster-app-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The app shells' core (§3.7): intents in, effects and view models out; owns the link on phones and talks to musterd on desktops"

[dependencies]
muster-agent = { path = "../muster-agent" }
muster-proto = { path = "../muster-proto" }
muster-rpc = { path = "../muster-rpc" }
musterd = { path = "../musterd" }
muster-terminal = { path = "../muster-terminal" }
muster-core = { path = "../muster-core" }
muster-net = { path = "../muster-net" }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
log.workspace = true
hex.workspace = true
serde_json.workspace = true
url = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
velopack = { version = "=1.2.158", features = ["public-utils"] }
p256.workspace = true
reqwest.workspace = true
sha2.workspace = true

[dev-dependencies]
muster-relay = { path = "../muster-relay" }
tempfile = "3"
env_logger.workspace = true

[lints]
workspace = true

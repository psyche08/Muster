			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# Every Muster process on a Mac comes from this bundle: the daemon\n# (launchd) and the command line, both from src/muster/target/release.\nBIN=\"$SRCROOT/../../../muster/target/release\"\nif [ ! -x \"$BIN/musterd\" ]; then echo \"warning: $BIN/musterd missing; build it with cargo (see README)\"; exit 0; fi\ninstall -m 0755 \"$BIN/musterd\" \"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/musterd\"\ninstall -d \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents\"\ninstall -m 0644 \"$SRCROOT/Apps/macOS/dev.linsheng.musterd.plist\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/\"\n# Same identity as the app: launchd's requirement for a bundled\n# LaunchAgent program is derived from the app's signature.\ncodesign --force --options runtime --entitlements \"$SRCROOT/Apps/macOS/musterd.entitlements\" --identifier dev.linsheng.musterd --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/musterd\"\n# The command line goes under Contents/Helpers: next to the app\n# executable, `muster` and `Muster` are one file on a\n# case-insensitive volume.\n[ -x \"$BIN/muster\" ] || { echo \"error: $BIN/muster missing; cargo build --release -p muster-cli\"; exit 1; }\ninstall -d \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers\"\ninstall -m 0755 \"$BIN/muster\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/muster\"\ncodesign --force --options runtime --identifier dev.linsheng.muster.cli --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/muster\"\n[ -x \"$BIN/muster-browser-host\" ] || { echo \"error: build muster-browser first\"; exit 1; }\ninstall -m 0755 \"$BIN/muster-browser-host\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/muster-browser-host\"\ncodesign --force --options runtime --identifier dev.linsheng.muster.browser --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/muster-browser-host\"\ninstall -d \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/ThirdParty\"\ninstall -m 0644 \"$SRCROOT/../../../../docs/third-party/orca-MIT.txt\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/ThirdParty/Orca-LICENSE.txt\"\nEXT=\"$SRCROOT/../../../browser/agenthalo-extension\"\ninstall -d \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/AgentHaloBrowser\"\ninstall -m 0644 \"$EXT/manifest.json\" \"$EXT/sw.js\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/AgentHaloBrowser/\"\nHELPER=\"$SRCROOT/../NetHelper\"\ninstall -d \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchServices\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons\"\nxcrun swiftc -O -o \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchServices/muster-helper\" \"$HELPER/main.swift\" \"$HELPER/LockedUseInstall.swift\"\ncodesign --force --options runtime --timestamp --identifier dev.linsheng.muster.helper --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchServices/muster-helper\"\ninstall -m 0644 \"$SRCROOT/Apps/macOS/dev.linsheng.muster.helper.plist\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons/\"\n# Locked Use is a standard part of every desktop distribution.\n# musterd requests installation from the SMAppService root helper.\nPLUGIN=\"$SRCROOT/../MusterLockedUse\"\nSIGN_IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$PLUGIN/build.sh\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/PlugIns/MusterLockedUse.bundle\"\ninstall -d \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/LockedUse\"\ninstall -m 0644 \"$PLUGIN/install.py\" \"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/LockedUse/install.py\"\n";

# Include in linsheng.dev's TLS server; public 8443 maps to internal 443.
location = /muster {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    return 302 https://linsheng.dev:8443/muster/;
}
location = /muster/ios {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    return 302 https://linsheng.dev:8443/muster/ios/;
}
location = /muster/desktop {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    return 302 https://linsheng.dev:8443/muster/desktop/;
}

# All entry pages, aliases, manifests and packages must be read afresh.
location ^~ /muster/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    expires off;
    etag off;
    if_modified_since off;
    autoindex off;

    # Once a version page is retired, its bookmark opens the current release.
    location ~ "^/muster/[0-9]+[.][0-9]+[.][0-9]+/?$" {
        try_files $uri/index.html @muster_latest;
    }
    location ~ "^/muster/[0-9]+[.][0-9]+[.][0-9]+/index[.]html$" {
        try_files $uri @muster_latest;
    }
    location ~ "^/muster/[0-9]+[.][0-9]+[.][0-9]+/install[.]plist$" {
        return 302 https://linsheng.dev:8443/muster/ios/manifest.plist;
    }

    # A page opened before a release must still resolve the latest manifest.
    location ~ "^/muster/ios/manifest-[a-f0-9]{64}\.plist$" {
        return 302 https://linsheng.dev:8443/muster/ios/manifest.plist;
    }
    # Current retry manifests remain direct; retired retries follow the latest.
    location ~ "^/muster/ios/install-[a-f0-9]{64}[.]plist$" {
        try_files $uri @muster_latest_manifest;
    }
    # Removed package links never serve an older binary or an HTML fallback.
    location ~ "^/muster/(ios/Muster-[a-f0-9]{64}\.ipa|desktop/Muster-[0-9][^/]*\.nupkg)$" {
        try_files $uri =410;
    }
}

location @muster_latest {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    return 302 https://linsheng.dev:8443/muster/;
}

location @muster_latest_manifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    return 302 https://linsheng.dev:8443/muster/ios/manifest.plist;
}
